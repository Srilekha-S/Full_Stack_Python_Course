<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h2>Length Converter</h2>
        <div class="inputdiv">
            <input type = "text" id = "input" placeholder = "length in cm"> 
        </div>
        <div>
            <button type = "submit" onclick="convert()" >Convert to inches</button>
        </div>
        <div id="outputdiv">
            <p>Output will be displayed here</p>
        </div> 
    </div>   
    <script>
    function convert(){
        const cmval = Number(document.getElementById("input").value)
        const inchval = cmval/2.54
        const outputdiv = document.getElementById("outputdiv")
        outputdiv.innerHTML = inchval.toFixed(2) + " inches"
    }
    </script>
</body>

</html>
